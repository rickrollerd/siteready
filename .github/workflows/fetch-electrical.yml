name: Fetch electrical sources

# Reads the electrical safety regulation and codes of practice from GitHub's
# servers and prints their text, so SiteReady's electrical steps can be checked.
on:
  workflow_dispatch:
  push:
    paths:
      - 'legislation-watch/fetch-electrical.js'
      - '.github/workflows/fetch-electrical.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: sudo apt-get install -y -qq poppler-utils > /dev/null
      - run: node legislation-watch/fetch-electrical.js
