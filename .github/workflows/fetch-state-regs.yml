name: Fetch state WHS regulations

# Fetches each state and territory's WHS regulation in full and commits the text to
# the state-sources branch, so SiteWrite's citations for those states can be
# checked against them.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-state-regs.yml'
      - 'legislation-watch/fetch-state-regs.js'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium > /dev/null
      - run: |
          node legislation-watch/fetch-state-regs.js
          ls -la state-sources
      - name: Commit the texts to the state-sources branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan state-sources-tmp
          git rm -rqf --cached .
          git add state-sources
          git commit -qm "State regulation texts, fetched $(date -u +%Y-%m-%d)"
          git push -f origin HEAD:refs/heads/state-sources
