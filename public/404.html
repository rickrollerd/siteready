<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found - SiteWrite</title>
  <link rel="icon" href="/icon-48.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    .skip { position: absolute; left: 8px; top: 8px; z-index: 100; padding: 8px 12px; background: #1f4e3d; color: #fff; font-weight: 600; text-decoration: none; border-radius: 6px; transform: translateY(-200%); }
    .skip:focus { transform: none; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 17px; line-height: 1.5; color: #1c2430; background: #eef1f4; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
    .brand { font-weight: 700; font-size: 20px; letter-spacing: -0.02em; color: #1f4e3d; text-decoration: none; display: inline-block; margin: 0 0 16px; }
    .panel { background: #fff; border: 1px solid #d5dbe3; border-radius: 8px; padding: 18px 16px; }
    h1 { font-size: 26px; margin: 0 0 10px; }
    p { margin: 0 0 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .button { display: inline-block; min-height: 44px; padding: 11px 16px; border-radius: 6px; background: #1f4e3d; color: #fff; font-weight: 600; text-align: center; text-decoration: none; box-sizing: border-box; }
    .button.light { background: #fff; color: #1f4e3d; border: 1px solid #1f4e3d; }
    .button:focus-visible { outline: 3px solid #c77700; outline-offset: 2px; }
    .site-footer { font-size: 13px; color: #5c6773; margin: 28px 0 12px; }
    .site-footer a { color: #1f4e3d; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to the main content</a>
  <div class="wrap">
    <a class="brand" href="/welcome.html">SiteWrite</a>
    <main id="main">
      <div class="panel">
        <h1>Page not found</h1>
        <p>That address is not on SiteWrite. Check the link you used, or go back to the site.</p>
        <div class="actions">
          <a class="button" href="/">Open SiteWrite</a>
          <a class="button light" href="/sitelink">Open SiteLink</a>
        </div>
      </div>
      <p class="site-footer"><a href="/welcome.html">Welcome</a> · <a href="/terms.html">Terms of use</a> · <a href="/privacy.html">Privacy</a></p>
    </main>
  </div>
</body>
</html>
