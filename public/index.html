<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiteReady</title>
  <meta name="description" content="A writing aid for one task. The subcontractor finishes the statement.">
  <link rel="icon" href="/favicon.ico">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      color: #1c2430;
      background: #eef1f4;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 64px; }
    header { margin-bottom: 22px; }
    h1 { font-size: 28px; line-height: 1.15; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.02em; }
    .lede { margin: 0; color: #5c6773; font-size: 15px; }
    .panel {
      background: #fff;
      border: 1px solid #d5dbe3;
      border-radius: 8px;
      padding: 22px 22px 18px;
      margin-top: 16px;
    }
    h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #3d4a59; margin: 0 0 14px; }
    .field { margin: 0 0 14px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .hint { display: block; font-weight: 400; color: #5c6773; margin-top: 2px; }
    input[type="text"], textarea {
      width: 100%;
      border: 1px solid #c5cdd6;
      border-radius: 6px;
      background: #fff;
      padding: 9px 11px;
      line-height: 1.4;
    }
    textarea { min-height: 96px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid #1f4e3d; outline-offset: 1px; border-color: #1f4e3d; }
    .states { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .states li { margin: 0; }
    .state {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid #e1e6ec;
      border-radius: 6px;
    }
    .state.disabled { color: #7b8794; background: #f7f8fa; }
    .state input { margin: 0; }
    .tag { margin-left: auto; font-size: 13px; color: #7b8794; }
    .actions { display: flex; gap: 8px; margin-top: 6px; }
    button {
      border: 1px solid #1f4e3d;
      background: #1f4e3d;
      color: #fff;
      border-radius: 6px;
      padding: 9px 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #fff; color: #1f4e3d; }
    button:disabled { opacity: 0.55; cursor: default; }
    .error { color: #8a2b2b; font-size: 14px; margin: 8px 0 0; }
    .sheet {
      background: #fff;
      border: 1px solid #d5dbe3;
      border-radius: 8px;
      padding: 28px 28px 22px;
      margin-top: 16px;
    }
    .sheet h3 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
    .meta { color: #5c6773; font-size: 14px; margin: 0 0 4px; }
    .status { font-size: 14px; margin: 0 0 16px; }
    table { width: 100%; border-collapse: collapse; margin: 8px 0 4px; }
    th, td { border: 1px solid #d5dbe3; text-align: left; vertical-align: top; padding: 7px 9px; font-size: 14px; }
    th { background: #f4f6f8; font-weight: 600; }
    .sheet h4 { font-size: 16px; margin: 20px 0 8px; }
    .sheet p, .sheet li { font-size: 15px; margin: 0 0 6px; }
    ol { margin: 0; padding-left: 1.2em; }
    .blank {
      min-height: 22px;
      border-bottom: 1px solid #c5cdd6;
      margin: 0 0 12px;
      white-space: pre-wrap;
    }
    .sign { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; }
    .sign div { border: 1px solid #d5dbe3; min-height: 64px; padding: 7px 9px; font-size: 13px; font-weight: 600; }
    .hidden { display: none; }
    @media (max-width: 640px) {
      .wrap { padding: 18px 12px 48px; }
      .panel, .sheet { padding: 16px; }
      .sign { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>SiteReady</h1>
      <p class="lede">A writing aid for one task. The subcontractor finishes the statement.</p>
    </header>

    <form id="start" class="panel">
      <h2>State and task</h2>
      <div class="field">
        <label>State</label>
        <ul class="states" id="states"></ul>
      </div>
      <div class="field">
        <label for="principal">Principal contractor</label>
        <input id="principal" type="text" autocomplete="organization">
      </div>
      <div class="field">
        <label for="company">Subcontractor</label>
        <input id="company" type="text" autocomplete="organization">
      </div>
      <div class="field">
        <label for="workplace">Workplace</label>
        <input id="workplace" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="site-manager">Site manager</label>
        <input id="site-manager" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="scaffold-supervisor">Scaffold supervisor</label>
        <input id="scaffold-supervisor" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="hospital">Hospital</label>
        <input id="hospital" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="first-aider">First aider</label>
        <input id="first-aider" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="muster-point">Muster point</label>
        <input id="muster-point" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="draft-date">Date of the draft</label>
        <input id="draft-date" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="task">Task
          <span class="hint">One task. Write what the work is.</span>
        </label>
        <textarea id="task" required></textarea>
      </div>
      <div class="actions">
        <button type="submit" id="continue">Continue</button>
      </div>
      <p class="error" id="start-error"></p>
    </form>

    <form id="facts" class="panel hidden">
      <h2>Facts</h2>
      <div id="required-block"></div>
      <h2 style="margin-top:18px">Site-specific</h2>
      <p class="lede" style="margin-bottom:12px">Leave a line blank if you do not have it. A blank line stays blank.</p>
      <div id="site-block"></div>
      <div class="actions">
        <button type="submit" id="prepare">Prepare the statement</button>
        <button type="button" class="secondary" id="back">Back</button>
      </div>
      <p class="error" id="facts-error"></p>
    </form>

    <section id="result" class="hidden"></section>
  </div>
  <script>
    const statesEl = document.getElementById('states');
    const factsForm = document.getElementById('facts');
    const resultEl = document.getElementById('result');
    let questions = null;

    function esc(value) {
      return String(value || '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[ch]);
    }

    function payload() {
      const state = document.querySelector('input[name="state"]:checked');
      const facts = {};
      const site = {};
      document.querySelectorAll('[data-fact]').forEach((el) => { facts[el.dataset.fact] = el.value.trim(); });
      document.querySelectorAll('[data-site]').forEach((el) => { site[el.dataset.site] = el.value.trim(); });
      const value = (id) => {
        const el = document.getElementById(id);
        return el ? el.value.trim() : '';
      };
      return {
        state: state ? state.value : '',
        task: value('task'),
        company: value('company'),
        workplace: value('workplace'),
        principalContractor: value('principal'),
        siteManager: value('site-manager'),
        scaffoldSupervisor: value('scaffold-supervisor'),
        hospital: value('hospital'),
        firstAider: value('first-aider'),
        musterPoint: value('muster-point'),
        date: value('draft-date'),
        facts,
        site,
      };
    }

    async function loadStates() {
      const response = await fetch('/api/states');
      const data = await response.json();
      statesEl.innerHTML = data.states.map((state) => `
        <li>
          <label class="state${state.loaded ? '' : ' disabled'}">
            <input type="radio" name="state" value="${esc(state.id)}" ${state.loaded ? '' : 'disabled'}>
            <span>${esc(state.name)}</span>
            <span class="tag">${state.loaded ? `${esc(state.compilation)} compilation` : 'Legislation not loaded'}</span>
          </label>
        </li>
      `).join('');
      const first = statesEl.querySelector('input:not(:disabled)');
      if (first) first.checked = true;
    }

    document.getElementById('start').addEventListener('submit', async (event) => {
      event.preventDefault();
      document.getElementById('start-error').textContent = '';
      resultEl.classList.add('hidden');
      const response = await fetch('/api/draft/questions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload()),
      });
      const data = await response.json();
      if (!response.ok) {
        document.getElementById('start-error').textContent = data.message || 'That state is not available.';
        return;
      }
      questions = data;
      const required = data.required || [];
      document.getElementById('required-block').innerHTML = required.length
        ? `<p class="lede" style="margin-bottom:12px">If a required fact is blank, the task is stood down. A method is not written.</p>` + required.map((item) => {
          const extra = item.prompt && item.prompt.replace(/\.$/, '') !== item.label
            ? `<span class="hint">${esc(item.prompt)}</span>` : '';
          return `
          <div class="field">
            <label for="fact-${esc(item.id)}">${esc(item.label)}${extra}</label>
            <textarea id="fact-${esc(item.id)}" data-fact="${esc(item.id)}"></textarea>
          </div>`;
        }).join('')
        : '<p class="lede">No further fact is required for this task.</p>';
      document.getElementById('site-block').innerHTML = (data.site || []).map((item) => `
        <div class="field">
          <label for="site-${esc(item.id)}">${esc(item.label)}</label>
          <textarea id="site-${esc(item.id)}" data-site="${esc(item.id)}"></textarea>
        </div>
      `).join('');
      factsForm.classList.remove('hidden');
      factsForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('back').addEventListener('click', () => {
      factsForm.classList.add('hidden');
      resultEl.classList.add('hidden');
    });

    function render(draft) {
      const row = (label, value) => (value ? `<tr><th>${esc(label)}</th><td>${esc(value)}</td></tr>` : '');
      const head = `
        <h3>Safe work method statement</h3>
        <p class="meta">${esc(draft.instrument)} · ${esc(draft.compilation)} compilation · section ${esc(draft.section)}</p>
        <p class="status">${esc(draft.status || 'Not approved. Not signed.')}</p>
        <table>
          <tbody>
            <tr><th>State</th><td>${esc(draft.state)}</td></tr>
            ${row('Principal contractor', draft.principalContractor)}
            <tr><th>Subcontractor</th><td>${esc(draft.subcontractor)}</td></tr>
            <tr><th>Workplace</th><td>${esc(draft.workplace)}</td></tr>
            ${row('Site manager', draft.siteManager)}
            ${row('Scaffold supervisor', draft.scaffoldSupervisor)}
            ${row('Hospital', draft.hospital)}
            ${row('First aider', draft.firstAider)}
            ${row('Muster point', draft.musterPoint)}
            <tr><th>Task</th><td>${esc(draft.task)}</td></tr>
            <tr><th>Date</th><td>${esc(draft.date)}</td></tr>
          </tbody>
        </table>`;
      if (draft.kind === 'stand-down') {
        return `${head}
          <h4>Stood down</h4>
          <p>${esc(draft.statement)}</p>
          <p><strong>Missing</strong></p>
          <ul>${draft.missing.map((item) => `<li>${esc(item)}</li>`).join('')}</ul>
          <p>No method is included.</p>`;
      }
      const risks = draft.highRisk.length
        ? `<ul>${draft.highRisk.map((item) => `<li>${esc(item)}</li>`).join('')}</ul>`
        : '<p>This task is not identified as high risk construction work.</p>';
      const hazards = draft.hazards.length
        ? `<table><thead><tr><th>Hazard</th><th>Risk</th></tr></thead><tbody>${draft.hazards.map((item) => `<tr><td>${esc(item.hazard)}</td><td>${esc(item.risk)}</td></tr>`).join('')}</tbody></table>`
        : '<p>None stated for this task.</p>';
      const controls = `<table><thead><tr><th>Hierarchy</th><th>Control</th></tr></thead><tbody>${draft.controls.map((item) => `<tr><td>${esc(item.level)}</td><td>${esc(item.text)}</td></tr>`).join('')}</tbody></table>`;
      const site = draft.site.map((field) => `<p><strong>${esc(field.label)}</strong></p><div class="blank">${esc(field.text)}</div>`).join('');
      const method = `<ol>${draft.method.map((step) => `<li>${esc(step)}</li>`).join('')}</ol>`;
      return `${head}
        <h4>High risk construction work</h4>${risks}
        <h4>Hazards and risks</h4>${hazards}
        <h4>Controls</h4>${controls}
        <h4>How the controls will be implemented, monitored and reviewed</h4>
        <p>${esc(draft.review)}</p>
        <h4>Site-specific</h4>${site}
        <h4>Method</h4>${method}
        <h4>Workers</h4>
        <div class="sign"><div>Name</div><div>Signature</div><div>Date</div></div>
        <div class="sign"><div></div><div></div><div></div></div>`;
    }

    factsForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('prepare');
      button.disabled = true;
      document.getElementById('facts-error').textContent = '';
      try {
        const body = JSON.stringify(payload());
        const response = await fetch('/api/draft', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body,
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'The statement could not be prepared.');
        resultEl.innerHTML = `<div class="sheet">${render(data)}</div>
          <div class="actions" style="margin-top:12px">
            <button type="button" id="download">Download Word</button>
          </div>`;
        resultEl.classList.remove('hidden');
        document.getElementById('download').addEventListener('click', () => downloadDocx(body, data.kind));
        resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (error) {
        document.getElementById('facts-error').textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    async function downloadDocx(body, kind) {
      const response = await fetch('/api/draft.docx', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body,
      });
      if (!response.ok) {
        document.getElementById('facts-error').textContent = 'The Word file could not be prepared.';
        return;
      }
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = kind === 'stand-down' ? 'SiteReady-stood-down.docx' : 'SiteReady.docx';
      link.click();
      URL.revokeObjectURL(url);
    }

    loadStates().catch(() => {
      document.getElementById('start-error').textContent = 'The state list could not be loaded.';
    });
  </script>
</body>
</html>
