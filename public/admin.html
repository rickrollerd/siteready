<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiteReady numbers</title>
  <link rel="icon" href="/icon-48.svg" type="image/svg+xml">
  <style>
    body { margin: 0; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #1c2430; background: #eef1f4; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #3d4a59; margin: 0 0 10px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .tile { background: #fff; border: 1px solid #d5dbe3; border-radius: 8px; padding: 12px 14px; }
    .tile .n { font-size: 26px; font-weight: 700; }
    .tile .l { font-size: 13px; color: #5c6773; }
    .panel { background: #fff; border: 1px solid #d5dbe3; border-radius: 8px; padding: 16px; margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #e1e6ec; text-align: left; padding: 6px 8px; font-size: 14px; vertical-align: top; }
    td.n { text-align: right; font-variant-numeric: tabular-nums; }
    .error { color: #8a2b2b; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>SiteReady numbers</h1>
    <p class="error" id="error"></p>
    <div class="tiles" id="tiles"></div>
    <div class="panel"><h2>What people did</h2><table id="actions"></table></div>
    <div class="panel"><h2>Recent errors</h2><table id="errors"></table></div>
  </div>
  <script src="/admin.js"></script>
</body>
</html>
